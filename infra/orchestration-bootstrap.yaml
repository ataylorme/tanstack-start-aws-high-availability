{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Isolated DevOps POC image repository; retained on stack deletion.",
  "Resources": {
    "Repository": {
      "Type": "AWS::ECR::Repository",
      "Properties": {
        "RepositoryName": "devops-orchestration-poc",
        "ImageTagMutability": "IMMUTABLE",
        "ImageScanningConfiguration": {
          "ScanOnPush": true
        },
        "EncryptionConfiguration": {
          "EncryptionType": "AES256"
        }
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    }
  },
  "Outputs": {
    "RepositoryUri": {
      "Value": {
        "Fn::GetAtt": [
          "Repository",
          "RepositoryUri"
        ]
      }
    }
  }
}
