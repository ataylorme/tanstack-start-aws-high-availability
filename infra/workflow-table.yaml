AWSTemplateFormatVersion: '2010-09-09'
Description: MRSC workflow table; deploy once in us-west-2 with east/west replicas and an Ohio witness.
Parameters:
  TableName:
    Type: String
    AllowedPattern: '[a-zA-Z0-9_.-]{3,255}'
    Description: Explicit project-specific table name shared by both application regions
Resources:
  WorkflowTable:
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      MultiRegionConsistency: STRONG
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: duePK, AttributeType: S }
        - { AttributeName: dueSK, AttributeType: N }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: DueIndex
          KeySchema:
            - { AttributeName: duePK, KeyType: HASH }
            - { AttributeName: dueSK, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      Replicas:
        - Region: us-west-2
        - Region: us-east-1
      GlobalTableWitnesses:
        - Region: us-east-2
Outputs:
  TableName:
    Value: !Ref WorkflowTable
