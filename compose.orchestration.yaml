services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0@sha256:7ef4a2c45b58c2901e70a4f28e0953a422c2c631baaaf5e2c15e0805740c7752
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath ./data'
    working_dir: /home/dynamodblocal
    user: '0:0'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - orchestration-dynamodb:/home/dynamodblocal/data
volumes:
  orchestration-dynamodb:
