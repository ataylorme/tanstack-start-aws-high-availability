name: Validate example
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.57.0
      - run: cfn-lint -t infra/*.yaml
      - uses: docker/setup-buildx-action@v3
      - name: Build Lambda-compatible single-platform image
        run: docker buildx build --platform linux/amd64 --provenance=false --sbom=false --load -t tanstack-ha:ci .
      - name: Smoke-test container HTTP server
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name tanstack-ha-ci -p 8080:8080 tanstack-ha:ci
          trap 'docker logs tanstack-ha-ci; docker stop tanstack-ha-ci' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep 'Two regions'
