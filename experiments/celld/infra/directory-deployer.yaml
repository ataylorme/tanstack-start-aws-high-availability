{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "CloudFormation-only execution role for one isolated on-demand MRSC directory and witness.",
  "Metadata": {
    "Scope": "Infrastructure provisioning only. Never attach this role to celld, edge, or an ownership writer.",
    "AsyncLifetime": "Keep this role available until asynchronous replica and witness operations and the CloudFormation stack operation finish. Do not constrain its permissions by source IP.",
    "FeatureBoundary": "Supports the current PAY_PER_REQUEST directory with PITR and default encryption. No provisioned autoscaling, CMK, streams, TTL, indexes, or resource-policy updates are authorized. Review permissions before adding those features.",
    "ProvisioningDataPermissions": "AWS MRSC creation documentation requires item APIs for provisioning replicas; these are restricted to this table and are not runtime ownership-writer authorization.",
    "Deployment": "Create this role stack first with CAPABILITY_IAM, then supply its RoleArn to the directory stack --role-arn. Caller needs separately controlled iam:PassRole; no PassRole grant is created here.",
    "Sources": [
      "https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-dynamodb-globaltable.html",
      "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/globaltables-security.html",
      "https://docs.aws.amazon.com/prescriptive-guidance/latest/least-privilege-cloudformation/service-roles-for-cloudformation.html",
      "https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cross-service-confused-deputy-prevention.html"
    ],
    "TrustBoundary": "Uses the documented ordinary CloudFormation stack service-role trust. SourceAccount/SourceArn examples in confused-deputy documentation apply to registry extension or StackSets roles, not proof that ordinary stack service-role requests carry those keys. No unsupported condition is asserted; constrain caller PassRole and stack-management permissions to this experiment.",
    "PostCreationReview": "After provisioning, review narrowing item API permissions if CloudFormation ongoing management can operate without them. This reduction has NOT been tested; do not remove required permissions mid-operation."
  },
  "Parameters": {
    "TableName": {
      "Type": "String",
      "AllowedPattern": "[a-zA-Z0-9_.-]{3,255}",
      "Description": "Exact isolated directory table name; must match the directory stack."
    }
  },
  "Resources": {
    "DeploymentRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudformation.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "OnlyThisCelldDirectory",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DirectoryProvisioning",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:CreateTable",
                    "dynamodb:CreateTableReplica",
                    "dynamodb:CreateGlobalTableWitness",
                    "dynamodb:UpdateTable",
                    "dynamodb:DeleteTable",
                    "dynamodb:DeleteTableReplica",
                    "dynamodb:DeleteGlobalTableWitness",
                    "dynamodb:DescribeTable",
                    "dynamodb:DescribeContinuousBackups",
                    "dynamodb:DescribeContributorInsights",
                    "dynamodb:DescribeTimeToLive",
                    "dynamodb:DescribeTableReplicaAutoScaling",
                    "dynamodb:DescribeKinesisStreamingDestination",
                    "dynamodb:GetResourcePolicy",
                    "dynamodb:ListTagsOfResource",
                    "dynamodb:TagResource",
                    "dynamodb:UntagResource",
                    "dynamodb:UpdateContinuousBackups",
                    "dynamodb:Query",
                    "dynamodb:Scan",
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:UpdateItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:BatchWriteItem"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:dynamodb:us-east-1:${AWS::AccountId}:table/${TableName}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:dynamodb:us-west-2:${AWS::AccountId}:table/${TableName}"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:dynamodb:us-east-2:${AWS::AccountId}:table/${TableName}"
                    }
                  ]
                },
                {
                  "Sid": "CreateOnlyDynamoDBReplicationServiceRole",
                  "Effect": "Allow",
                  "Action": [
                    "iam:CreateServiceLinkedRole"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/replication.dynamodb.amazonaws.com/AWSServiceRoleForDynamoDBReplication"
                  },
                  "Condition": {
                    "StringEquals": {
                      "iam:AWSServiceName": "replication.dynamodb.amazonaws.com"
                    }
                  }
                }
              ]
            }
          }
        ]
      }
    }
  },
  "Outputs": {
    "RoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "DeploymentRole",
          "Arn"
        ]
      }
    }
  }
}
